name: unazin
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# CONFIGURAÇÃO DOS ÍCONES (Adicionada fora da seção flutter)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/app_icon.png" # Certifique-se de que o arquivo existe neste caminho
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - lib/assets/